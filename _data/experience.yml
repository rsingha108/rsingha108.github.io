- org: "Microsoft Research, Redmond"
  role: "Research Intern"
  dates: "Jun – Sep 2025"
  title: "Autonomous Multi-Agent LLM Test-Suite Generation for Internet Protocols"
  mentors: "Soheil Abbasloo"
