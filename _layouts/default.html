<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <nav class="topnav">
    <div class="wrap topnav-inner">
      <a class="brand" href="#top">{{ site.title }}</a>
      <div class="navlinks">
        <a href="#research">Research</a>
        <a href="#publications">Publications</a>
        <a href="#experience">Experience</a>
        <a href="#education">Education</a>
        <a href="{{ site.cv | relative_url }}">CV</a>
      </div>
    </div>
  </nav>

  <header class="hero wrap" id="top">
    <img class="avatar" src="{{ '/images/rathin.jpg' | relative_url }}" alt="Photo of {{ site.title }}">
    <div class="hero-text">
      <h1>{{ site.title }}</h1>
      <p class="role">{{ site.role }}</p>
      <p class="affil">{{ site.affiliation }}</p>
      <div class="contact">
        <a href="mailto:{{ site.email }}">Email</a>
        <a href="{{ site.cv | relative_url }}">CV (PDF)</a>
        <a href="https://github.com/{{ site.github_username }}">GitHub</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="wrap footer">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }} &middot; Last updated {{ site.time | date: "%B %Y" }}</p>
  </footer>
</body>
</html>
